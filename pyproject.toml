[project]
name = "ai-spirit-agent"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Order of Devs" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = "~=3.14.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "knowledge-base",
    "agentic-runtime",
    "personal-assistant",
    "workshops",
    "chat",
    "cli",
    "core",
    "dataloader",
    "registry",
    "mlflow>=3.15.1",
    "typer>=0.24.1",
    "torchaudio>=2.11.0",
    "onnx-asr>=0.11.0",
    "deepeval>=4.2.0",
    "cachetools>=7.0.5",
    "onnxruntime>=1.24.3",
    "providers",
    "mlx>=0.31.1; sys_platform == 'darwin'",
    "mlx-lm>=0.31.1; sys_platform == 'darwin'",
    "mlx-vlm>=0.6.16; sys_platform == 'darwin'",
    "agentic",
    "orjson>=3.11.7",
    'importlib-metadata; python_version<"3.15"',
    "structlog>=25.5.0",
    "evaluation",
    "agentic-graph",
    "gitpython>=3.1.46",
    # Was pinned to 5.3.0 by a fork of mlx-audio; upstream mlx-audio 0.5.0
    # requires >=5.14.0, which unblocked this.
    "transformers>=5.15.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-markdown>=0.5.1",
    # Capped at 1.16.x, not by us: huggingface-hub>=1.28 wants click>=8.4.2 while
    # deepeval pins click<8.4.0. Raise this once deepeval relaxes that ceiling.
    "huggingface-hub>=1.16.1",
    "mlx-audio>=0.5.0; sys_platform == 'darwin'",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "mflux>=0.17.0; sys_platform == 'darwin'",
    "gradio>=6.9.0",
    "numpy>=2.4.4",
    "regex>=2026.3.32",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    # Named rather than left to `pytest-asyncio` to drag in. A test group that
    # does not name its own runner is one where `uv run pytest` finds nothing
    # and the reason is three levels down somebody else's dependency tree.
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.15.9",
    "ty>=0.0.25",
]


[tool.ruff]
line-length = 99
src = ["packages/*/src"]
extend-exclude = ["apps", ".venv"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting
ignore = [
    # Shutdown, tracing and best-effort cleanup paths deliberately swallow
    # everything so one failing step cannot abort the rest. They log first.
    "BLE001",
    "S110",
    "S112",
    # Malformed user input and config documents are reported as ValueError by
    # design (callers such as workshops.lab0.tools.calculate catch it); TypeError
    # is reserved for genuinely wrong Python types.
    "TRY004",
    # Exception messages are written for humans at the call site.
    "TRY003",
    "EM101",
    "EM102",
]

[tool.ruff.lint.per-file-ignores]
# CLI entry points print to stdout on purpose — that is their interface.
"packages/cli/**" = ["T20"]
"packages/dataloader/**" = ["T20"]
"packages/workshops/**" = ["T20"]
"packages/providers/src/providers/_cli.py" = ["T20"]
"packages/evaluation/src/evaluation/print_full_rank_list.py" = ["T20"]
"packages/evaluation/src/evaluation/notes_prompt_optimization_miprov2.py" = ["T20"]
# Tests assert on internals and use fixtures that shadow names.
"**/tests/**" = ["S101", "SLF001", "PLR2004", "ANN"]

[tool.ruff.lint.isort]
known-first-party = [
    "agentic",
    "agentic_graph",
    "agentic_runtime",
    "chat",
    "cli",
    "core",
    "dataloader",
    "evaluation",
    "knowledge_base",
    "personal_assistant",
    "providers",
    "registry",
    "workshops",
]
force-sort-within-sections = true

[tool.pytest.ini_options]
markers = [
    "workflow_smoke: live-model workflow smoke tests that validate a single workflow or callback.",
    "agent_e2e_live: runtime-first live end-to-end tests for the full agentic system.",
    "distributed_resilience: end-to-end resilience tests requiring LLM server (Iggy optional).",
]

[tool.uv.workspace]
members = [
    "packages/knowledge_base",
    "packages/chat",
    "packages/agentic_runtime",
    "packages/cli",
    "packages/evaluation",
    "packages/core",
    "packages/registry",
    "packages/agentic",
    "packages/dataloader",
    "packages/workshops",
    "packages/personal_assistant",
    "packages/agentic_graph",
    "packages/providers",
]

[tool.uv.sources]
knowledge_base = { workspace = true }
chat = { workspace = true }
agentic_runtime = { workspace = true }
agentic = { workspace = true }
cli = { workspace = true }
core = { workspace = true }
registry = { workspace = true }
evaluation = { workspace = true }
dataloader = { workspace = true }
personal_assistant = { workspace = true }
agentic_graph = { workspace = true }
providers = { workspace = true }
workshops = { workspace = true }
# Pinned to a revision, as planner pins it, for the reason a floating branch
# would defeat: the SDK is what an agent's traces are shaped by, and "whatever
# was on main that morning" is not something a trace can be read against later.
#
# The same revision planner is on. Two repositories reading one SDK should read
# one version of it — and the rev has to be *pushed*, which is the mistake this
# line was written with the first time: a local commit resolves for whoever made
# it and for nobody else.
aiwatcher-sdk = { git = "https://github.com/aispiritlabs/aispiritlabs-aiwatcher.git", rev = "770eb970f7f3353b144fcfa09bf0475198514c69", subdirectory = "sdk/python" }
