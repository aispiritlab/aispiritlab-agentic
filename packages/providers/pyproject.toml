[project]
name = "providers"
version = "0.1.0"
description = "Model providers, orchestrator, and subprocess-based inference management"
readme = "README.md"
authors = [
    { name = "Mateusz Kubaszek", email = "mkubasz@gmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "httpx>=0.28.0",
    "huggingface-hub>=1.7.2",
    "mflux>=0.17.0; sys_platform == 'darwin'",
    "mlx>=0.31.1; sys_platform == 'darwin'",
    "mlx-audio; sys_platform == 'darwin'",
    "mlx-lm>=0.31.1; sys_platform == 'darwin'",
    "mlx-vlm>=0.4.1; sys_platform == 'darwin'",
    "numpy>=2.4.3",
    "openai>=2.30.0",
    "regex>=2026.2.28",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[project.scripts]
providers = "providers:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
