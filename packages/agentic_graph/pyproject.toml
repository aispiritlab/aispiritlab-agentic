[project]
name = "agentic-graph"
version = "0.1.0"
description = "Visual agent composition with PixiJS canvas, validation, and builder code generation"
readme = "README.md"
authors = [
    { name = "Mateusz Kubaszek", email = "mkubasz@gmail.com" }
]
requires-python = "==3.14.*"
dependencies = [
    "agentic",
    "agentic-runtime",
    "chat",
    "gradio",
    "knowledge-base",
    "structlog>=25.5.0",
]

[project.scripts]
agentic-graph = "agentic_graph:main"
agentics-manager = "agentic_graph:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
